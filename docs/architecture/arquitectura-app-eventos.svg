<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280" role="img" aria-labelledby="title description">
  <title id="title">Arquitectura de Cortés Rodríguez Asesores</title>
  <desc id="description">Arquitectura actual de la aplicación: Vue y Cloudflare Worker, pagos de Mercado Pago, Neon, Cloudflare Queues, R2, Resend y notificaciones realtime por usuario.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 10 6 1 11" fill="none" stroke="#527894" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 10 6 1 11" fill="none" stroke="#d9494e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 10 6 1 11" fill="none" stroke="#bd7c19" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-violet" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 10 6 1 11" fill="none" stroke="#7659b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#173b58" flood-opacity=".08"/></filter>
    <style>
      text{font-family:Inter,Arial,Helvetica,sans-serif;fill:#173b58}.title{font-size:38px;font-weight:800;letter-spacing:-.7px}.subtitle{font-size:17px;fill:#647c90}.section{font-size:13px;font-weight:800;letter-spacing:1.7px;fill:#748ca0}.node{fill:#fff;stroke:#d9e4ed;stroke-width:1.5;filter:url(#shadow)}.node-title{font-size:20px;font-weight:800}.node-sub{font-size:14px;fill:#678096}.node-detail{font-size:13px;fill:#71889c}.badge{font-size:12px;font-weight:700}.label{font-size:13px;font-weight:700;fill:#55758e}.small{font-size:12px;fill:#71889c}.flow{fill:none;stroke:#527894;stroke-width:3;marker-end:url(#arrow)}.thin{fill:none;stroke:#527894;stroke-width:2.5;marker-end:url(#arrow)}.external{fill:none;stroke:#d9494e;stroke-width:3;marker-end:url(#arrow-red)}.recovery{fill:none;stroke:#bd7c19;stroke-width:3;stroke-dasharray:9 8;marker-end:url(#arrow-amber)}.realtime{fill:none;stroke:#7659b5;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#arrow-violet)}
    </style>
  </defs>
  <rect width="1800" height="1280" fill="#f5f8fb"/><rect width="1800" height="11" fill="#ed1c24"/>
  <text x="62" y="70" class="title">Arquitectura de la aplicación</text>
  <text x="64" y="105" class="subtitle">Cortés Rodríguez Asesores · Flujos actuales · Actualizada el 30 de octubre de 2026</text>
  <rect x="1452" y="48" width="284" height="38" rx="19" fill="#e6f0f6"/><circle cx="1474" cy="67" r="5" fill="#138b91"/><text x="1488" y="72" class="badge">Cloudflare · Neon · Resend</text>

  <text x="62" y="155" class="section">1 · ACCESO, APLICACIÓN Y PAGOS</text>
  <g>
    <rect x="62" y="180" width="270" height="174" rx="15" class="node"/><circle cx="105" cy="222" r="14" fill="#2877a7"/><path d="M80 263c2-18 12-27 25-27s23 9 25 27v8H80z" fill="#2877a7"/>
    <text x="148" y="226" class="node-title">Personas</text><text x="86" y="302" class="node-sub">Cliente · agente · experto · admin</text><text x="86" y="328" class="node-detail">Sesiones y permisos por usuario</text>
  </g>
  <g>
    <rect x="397" y="180" width="330" height="174" rx="15" class="node"/><rect x="426" y="205" width="64" height="48" rx="7" fill="#fff" stroke="#2877a7" stroke-width="4"/><path d="M427 218h62" stroke="#2877a7" stroke-width="4"/><circle cx="438" cy="212" r="2.5" fill="#2877a7"/><circle cx="448" cy="212" r="2.5" fill="#2877a7"/><circle cx="458" cy="212" r="2.5" fill="#2877a7"/>
    <text x="510" y="220" class="node-title">Frontend Vue</text><text x="510" y="246" class="node-sub">Assets estáticos · Cloudflare</text><text x="426" y="292" class="node-detail">Landing · solicitud · panel · portal</text><rect x="426" y="310" width="272" height="24" rx="12" fill="#fcebed"/><text x="438" y="327" class="badge" fill="#b93840">ES / EN · diseño responsive</text>
  </g>
  <g>
    <rect x="790" y="180" width="390" height="174" rx="15" fill="#0b3553" stroke="#0b3553" class="node"/><rect x="817" y="207" width="61" height="52" rx="8" fill="#0e8992"/><text x="829" y="241" font-size="20" font-weight="800" fill="#fff">API</text>
    <text x="899" y="220" class="node-title" fill="#fff">Cloudflare Worker</text><text x="899" y="246" font-size="14" fill="#c6d8e4">API · autenticación · lógica</text><text x="817" y="294" font-size="13" fill="#d0e0e9">Valida permisos y coordina pagos, eventos y archivos.</text><text x="817" y="322" font-size="12" fill="#9fc1d2">Frontend y API comparten despliegue.</text>
  </g>
  <g>
    <rect x="1264" y="180" width="470" height="174" rx="15" class="node"/><rect x="1292" y="205" width="62" height="49" rx="7" fill="#2674a5"/><path d="M1292 218h62" stroke="#fff" stroke-width="4"/><text x="1314" y="246" font-size="23" font-weight="800" fill="#fff">$</text>
    <text x="1376" y="220" class="node-title">Mercado Pago</text><text x="1376" y="246" class="node-sub">Checkout Pro o Bricks</text><text x="1292" y="294" class="node-detail">Webhook y retorno llegan al Worker.</text><text x="1292" y="321" class="node-detail">El servidor verifica y concilia el pago.</text>
  </g>
  <path d="M332 258h65" class="flow"/><text x="344" y="245" class="label">HTTPS</text><path d="M727 258h63" class="flow"/><text x="735" y="245" class="label">API / JSON</text><path d="M1180 239h84" class="external"/><text x="1192" y="226" class="label" fill="#bd3e43">Checkout</text><path d="M1264 300h-84" class="external"/>

  <rect x="397" y="382" width="330" height="64" rx="12" fill="#f1eef9" stroke="#dcd4ef"/><circle cx="421" cy="414" r="8" fill="#7659b5"/><text x="441" y="409" font-size="14" font-weight="800" fill="#5f4b93">Cloudflare Flagship</text><text x="441" y="430" class="small">Flags: solicitud pública · Checkout Bricks</text>
  <path d="M562 382v-28" class="realtime"/><path d="M727 414h63v-34" class="realtime"/>

  <text x="62" y="493" class="section">2 · ESTADO, EVENTOS Y ARCHIVOS</text>
  <g>
    <rect x="62" y="520" width="315" height="190" rx="15" class="node"/><path d="M91 557h38v48H91zm49 0h38v48h-38z" fill="#0e8992"/><path d="M100 570h20m-20 10h20m-20 10h20m29-20h20m-20 10h20m-20 10h20" stroke="#fff" stroke-width="3"/>
    <text x="196" y="562" class="node-title">Cloudflare R2</text><text x="196" y="588" class="node-sub">Adjuntos de solicitudes</text><text x="88" y="650" class="node-detail">El Worker valida permisos y solicita</text><text x="88" y="674" class="node-detail">a R2 guardar o devolver cada archivo.</text>
  </g>
  <g>
    <rect x="430" y="520" width="385" height="190" rx="15" class="node"/><ellipse cx="474" cy="562" rx="25" ry="9" fill="#0e8992"/><path d="M449 562v44c0 6 11 11 25 11s25-5 25-11v-44" fill="#0e8992"/><ellipse cx="474" cy="606" rx="25" ry="9" fill="#0e8992"/><path d="M449 584c0 6 11 11 25 11s25-5 25-11" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="520" y="562" class="node-title">Neon PostgreSQL</text><text x="520" y="588" class="node-sub">Fuente de verdad operacional</text><rect x="458" y="648" width="322" height="36" rx="8" fill="#eaf4f7"/><text x="475" y="671" class="badge" fill="#17687a">Negocio · outbox · efectos idempotentes</text>
  </g>
  <g>
    <rect x="874" y="520" width="306" height="190" rx="15" class="node"/><rect x="905" y="557" width="58" height="17" rx="8" fill="#0e8992"/><rect x="905" y="580" width="58" height="17" rx="8" fill="#0e8992"/><rect x="905" y="603" width="58" height="17" rx="8" fill="#0e8992"/><circle cx="920" cy="565" r="3" fill="#fff"/><circle cx="931" cy="565" r="3" fill="#fff"/><circle cx="942" cy="565" r="3" fill="#fff"/>
    <text x="982" y="562" class="node-title">Cloudflare Queues</text><text x="982" y="588" class="node-sub">Mensajes con eventId</text><text x="905" y="650" class="node-detail">Reintentos y cola de fallos (DLQ).</text><text x="905" y="674" class="node-detail">El evento se guarda antes de publicar.</text>
  </g>
  <g>
    <rect x="1240" y="520" width="494" height="190" rx="15" class="node"/><rect x="1271" y="555" width="53" height="59" rx="8" fill="#0b3553"/><path d="M1283 572h29m-29 11h29m-29 11h18" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="1345" y="562" class="node-title">Consumidores Worker</text><text x="1345" y="588" class="node-sub">Procesamiento idempotente</text><text x="1271" y="650" class="node-detail">Correo · notificación persistida · realtime</text><text x="1271" y="674" class="node-detail">Cada efecto usa una clave estable.</text>
  </g>

  <!-- Principal event flow: transaction, queue, consumer -->
  <path d="M985 354v96H622v70" class="flow"/><text x="742" y="438" class="label">Transacción + outbox</text>
  <path d="M815 615h59" class="flow"/>
  <path d="M1180 615h60" class="flow"/>
  <path d="M800 354v16H45v140h174v10" class="thin"/>

  <text x="62" y="755" class="section">3 · EFECTOS, REALTIME Y RECUPERACIÓN</text>
  <g>
    <rect x="62" y="782" width="315" height="168" rx="15" fill="#fffaf1" stroke="#ead6b2" stroke-width="1.5"/><circle cx="104" cy="827" r="21" fill="#fff0d7" stroke="#bd7c19" stroke-width="3"/><path d="M104 815v13l10 7" fill="none" stroke="#bd7c19" stroke-width="3" stroke-linecap="round"/>
    <text x="143" y="826" font-size="17" font-weight="800">Recuperación programada</text><text x="88" y="874" class="node-sub">Cron del Worker · lee Neon</text><text x="88" y="902" class="node-detail">Encuentra eventos y efectos pendientes</text><text x="88" y="926" class="node-detail">en el outbox y los reenvía a Queue.</text>
  </g>
  <g>
    <rect x="430" y="782" width="385" height="168" rx="15" fill="#fff8eb" stroke="#ebd2a9" stroke-width="1.5"/><path d="M470 814 493 856h-46z" fill="#bd7c19"/><text x="466" y="846" font-size="25" font-weight="900" fill="#fff">!</text>
    <text x="513" y="826" class="node-title">DLQ / fallos persistentes</text><text x="458" y="874" class="node-sub">Recibe mensajes agotados de Queue</text><text x="458" y="902" class="node-detail">Administración puede reencolarlos</text><text x="458" y="926" class="node-detail">o descartarlos con auditoría.</text>
  </g>
  <g>
    <rect x="874" y="782" width="306" height="168" rx="15" fill="#f3f0fa" stroke="#d9d0ed" stroke-width="1.5"/><circle cx="922" cy="826" r="15" fill="#7659b5"/><circle cx="901" cy="859" r="11" fill="#7659b5"/><circle cx="943" cy="859" r="11" fill="#7659b5"/><path d="m914 838-8 11m24-11 8 11m-26 0h22" fill="none" stroke="#7659b5" stroke-width="4"/>
    <text x="969" y="826" class="node-title">NotificationHub</text><text x="902" y="884" class="node-sub">Consumer publica por userId</text><text x="902" y="912" class="node-detail">WebSocket envía solo IDs mínimos.</text><text x="902" y="934" class="node-detail">La API devuelve datos autorizados.</text>
  </g>
  <g>
    <rect x="1240" y="782" width="494" height="168" rx="15" class="node"/><rect x="1271" y="814" width="58" height="43" rx="6" fill="#2674a5"/><path d="m1275 820 25 19 25-19" fill="none" stroke="#fff" stroke-width="3"/>
    <text x="1350" y="826" class="node-title">Resend</text><text x="1350" y="853" class="node-sub">Consumer envía; webhook vuelve al Worker</text><text x="1271" y="900" class="node-detail">El webhook actualiza estados en Neon.</text><text x="1271" y="926" class="node-detail">La apertura detectada no prueba lectura.</text>
  </g>

  <!-- Consumer outputs -->
  <path d="M1487 710v72" class="flow"/><text x="1501" y="755" class="label">Enviar correo</text>
  <path d="M1340 710v46h-170v26" class="realtime"/>
  <path d="M905 710v22H620v50" class="recovery"/>
  <path d="M620 782v-16h254v-56" class="recovery"/>
  <path d="M219 782v-40h403v-32" class="thin"/>
  <path d="M1180 858h20V470H560V354" class="realtime"/>
  <path d="M1734 858h36V168h-670v12" class="realtime"/>

  <rect x="62" y="1000" width="1672" height="92" rx="14" fill="#e7f0f6"/><rect x="62" y="1000" width="9" height="92" rx="4" fill="#0e8992"/><text x="94" y="1035" font-size="15" font-weight="800">GARANTÍAS TRANSVERSALES</text><text x="94" y="1063" font-size="15" fill="#365c77">Idempotencia · permisos por rol y usuario · validación de pagos en servidor · auditoría · reintento seguro</text>
  <line x1="1112" y1="1017" x2="1112" y2="1075" stroke="#c5d7e3" stroke-width="2"/><text x="1140" y="1035" class="small">Línea continua: flujo principal</text><line x1="1140" y1="1062" x2="1180" y2="1062" class="recovery"/><text x="1193" y="1067" class="small">Discontinua: recuperación / realtime</text>
  <text x="64" y="1142" font-size="13" fill="#7b91a3">Neon conserva el estado. Queues transporta identificadores; la información sensible se consulta mediante APIs autorizadas.</text>
</svg>
